<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moj Pregled</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0e0f11;--bg2:#141618;--bg3:#1c1e22;--bg4:#242729;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#f0f0f0;--text2:#8a8f9a;--text3:#4a4f5a;--accent:#4f8ef7;--green:#34c98a;--amber:#f0a030;--red:#e85555;--purple:#a78bfa;--green-bg:rgba(52,201,138,0.1);--amber-bg:rgba(240,160,48,0.1);--red-bg:rgba(232,85,85,0.1);--blue-bg:rgba(79,142,247,0.1);--r:12px;--r-sm:8px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
nav{position:sticky;top:0;z-index:100;background:rgba(14,15,17,0.95);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:56px}
.nav-logo{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.nav-links{display:flex;gap:2px;flex-wrap:wrap}
.nav-btn-t{padding:6px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border:none;background:none;font-family:inherit;transition:all .15s}
.nav-btn-t:hover,.nav-btn-t.on{background:var(--bg3);color:var(--text)}
.nav-date{font-size:12px;color:var(--text3);font-family:monospace}
main{max-width:1060px;margin:0 auto;padding:1.5rem 1.5rem 5rem}

/* reuse widget styles */
.app{font-size:14px}
.tabs{display:flex;gap:2px;border-bottom:.5px solid var(--border);margin-bottom:1.25rem;flex-wrap:wrap}
.tab{padding:7px 14px;border:none;background:none;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;transition:all .15s}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.tab:hover:not(.on){color:var(--text)}
.sec{display:none}.sec.on{display:block}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:.875rem;border-bottom:1px solid var(--border)}
.htitle{font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px}
.hicon{width:30px;height:30px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:15px}
.hsub{font-size:12px;color:var(--text2);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:1.25rem}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem}
.sl{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.sv{font-size:20px;font-weight:500}
.ss{font-size:11px;color:var(--text3);margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:1.25rem}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.125rem;transition:border-color .2s}
.card:hover{border-color:var(--border2)}
.ctitle{font-size:14px;font-weight:500}
.csub{font-size:12px;color:var(--text2)}
.div{height:1px;background:var(--border);margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px}
.rl{color:var(--text2)}
.rv{font-weight:500;font-size:12px;font-family:monospace}
.tbl{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1.25rem}
.th{display:grid;padding:7px 14px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.tr{display:grid;padding:10px 14px;border-bottom:1px solid var(--border);align-items:center;font-size:13px;transition:background .15s}
.tr:last-child{border-bottom:none}
.tr:hover{background:rgba(255,255,255,0.02)}
.tf{padding:8px 14px;border-top:1px solid var(--border2);font-size:12px;font-weight:500;text-align:right;font-family:monospace;color:var(--text2)}
.pill{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:500;background:var(--bg3);color:var(--text2);border:1px solid var(--border2)}
.add{padding:5px 11px;border-radius:var(--r-sm);border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;transition:all .15s}
.add:hover{background:var(--bg3);color:var(--text)}
.sub-l{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:.875rem 0 .4rem}
.del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:2px 5px;border-radius:4px;line-height:1;transition:all .15s}
.del:hover{color:var(--red);background:var(--red-bg)}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center}
.mo.on{display:flex}
.md{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:1.25rem;width:min(440px,96vw);max-height:88vh;overflow-y:auto}
.mt{font-size:15px;font-weight:500;margin-bottom:1rem}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.fg input,.fg select,.fg textarea{font-family:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--bg3);color:var(--text);width:100%;transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--accent)}
.fg select option{background:var(--bg3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.bc{padding:6px 13px;border-radius:var(--r-sm);border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit}
.bs{padding:6px 16px;border-radius:var(--r-sm);border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.empty{text-align:center;padding:2rem;color:var(--text3);font-size:13px}
.nav-mo{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
.nav-btn{padding:4px 12px;border-radius:var(--r-sm);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-size:14px;font-family:inherit;transition:all .15s}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.bar-wrap{background:var(--bg3);border-radius:6px;overflow:hidden;height:24px;display:flex;margin:6px 0 4px}
.bar-out{background:var(--red-bg);border-right:1px solid var(--red);height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--red);transition:width .4s}
.bar-in{background:var(--green-bg);height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--green);transition:width .4s}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
footer{text-align:center;padding:2rem;font-size:12px;color:var(--text3);border-top:1px solid var(--border)}
</style>
</head>

</div></div>
<div class="mo" id="mo-sub"><div class="md">

let _fm=new Date().toISOString().slice(0,7);

document.getElementById('nav-date').textContent=new Date().toLocaleDateString('sl-SI',{weekday:'short',day:'numeric',month:'long',year:'numeric'});

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function euro(v){return parseFloat(v||0).toFixed(2)+' €'}
function daysTo(d){return Math.round((new Date(d)-new Date())/864e5)}
function vn(id){const v=db.vehicles.find(x=>x.id===id);return v?v.reg||v.name:'—'}
function pvs(id){const el=document.getElementById(id);if(!el)return;el.innerHTML=db.vehicles.map(v=>`<option value="${v.id}">${v.name} (${v.reg})</option>`).join('')}
function om(id){document.getElementById(id).classList.add('on')}
function cm(id){document.getElementById(id).classList.remove('on')}
document.querySelectorAll('.mo').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on')}));

function init(){
  db=JSON.parse(JSON.stringify(INIT));
  try{
    const d=localStorage.getItem('mpv3');

      const s=JSON.parse(d);
      ['vehicles','insurances','expenses','services','homeExpenses','finances','subscriptions'].forEach(k=>{
        if(!s[k])s[k]=[];
        INIT[k].forEach(item=>{if(!s[k].find(x=>x.id===item.id))s[k].push(item)});
      });
      db=s;
    }
  }catch(e){}
  const td=new Date().toISOString().slice(0,10);

  rAll();
}

  el.innerHTML=h;
}

  if(!db.subscriptions.length){h+=`<div class="empty">Ni naročnin.</div>`}else{
    h+=`<div class="sub-l">Aktivne naročnine</div><div class="cards">`;
    db.subscriptions.forEach(s=>{h+=`<div class="card"><div style="display:flex;justify-content:space-between"><div><div class="ctitle">${s.name}</div><div class="csub">${s.cat}</div></div><button class="del" onclick="delI('subscriptions','${s.id}')">✕</button></div><div class="div"></div><div class="row"><span class="rl">Znesek</span><span style="font-family:monospace;font-size:13px;font-weight:500">${euro(s.amount)}<span style="font-size:11px;color:var(--text3)"> /${s.freq.toLowerCase()}</span></span></div>${s.day?`<div class="row"><span class="rl">Dan</span><span class="rv" style="font-family:inherit">${s.day}.</span></div>`:''}${s.date?`<div class="row"><span class="rl">Zadnje plačilo</span><span class="rv">${s.date}</span></div>`:''}</div>`});
    h+=`</div><div class="sub-l">Seznam</div><div class="tbl"><div class="th" style="grid-template-columns:2fr 1.5fr 1fr 1fr 1fr 28px"><span>Naziv</span><span>Kategorija</span><span>Pogostost</span><span>Dan</span><span>Znesek</span><span></span></div>`;
    [...db.subscriptions].sort((a,b)=>parseFloat(b.amount||0)-parseFloat(a.amount||0)).forEach(s=>{h+=`<div class="tr" style="grid-template-columns:2fr 1.5fr 1fr 1fr 1fr 28px"><div style="font-weight:500">${s.name}</div><div style="font-size:12px;color:var(--text2)">${s.cat}</div><div><span class="pill">${s.freq}</span></div><div style="font-family:monospace;font-size:12px">${s.day?s.day+'.':'—'}</div><div style="font-weight:500">${euro(s.amount)}</div><div><button class="del" onclick="delI('subscriptions','${s.id}')">✕</button></div></div>`});
    h+=`<div class="tf" style="display:flex;justify-content:flex-end;gap:20px"><span style="color:var(--text2)">Mesečno: <b>${euro(mT)}</b></span><span style="color:var(--text2)">Letno: <b>${euro(yT)}</b></span></div></div>`;
  }
  el.innerHTML=h;
}

function rExp(){
  const el=document.getElementById('s-strosek');
  const m=new Date().toISOString().slice(0,7);
  const mT=db.expenses.filter(e=>e.date&&e.date.startsWith(m)).reduce((a,e)=>a+parseFloat(e.amount||0),0);
  const yT=db.expenses.filter(e=>e.date&&e.date.startsWith('2026')).reduce((a,e)=>a+parseFloat(e.amount||0),0);
  const tot=db.expenses.reduce((a,e)=>a+parseFloat(e.amount||0),0);
  let h=`<div class="hdr"><div><div class="htitle"><div class="hicon" style="background:var(--amber-bg)">🧾</div>Ostali stroški</div><div class="hsub">Izleti, darila, sprotni stroški</div></div><button class="add" onclick="om('mo-exp')">+ Dodaj</button></div>`;
  h+=`<div class="stats"><div class="stat"><div class="sl">Ta mesec</div><div class="sv">${euro(mT)}</div></div><div class="stat"><div class="sl">Letos</div><div class="sv">${euro(yT)}</div></div><div class="stat"><div class="sl">Skupaj</div><div class="sv">${euro(tot)}</div></div><div class="stat"><div class="sl">Vnosov</div><div class="sv" style="color:var(--accent)">${db.expenses.length}</div></div></div>`;
  h+=`<div class="tbl"><div class="th" style="grid-template-columns:2fr 2fr 1.2fr 1fr 28px"><span>Kategorija</span><span>Opis</span><span>Datum</span><span>Znesek</span><span></span></div>`;
  const s=[...db.expenses].sort((a,b)=>new Date(b.date)-new Date(a.date));
  s.forEach(e=>{h+=`<div class="tr" style="grid-template-columns:2fr 2fr 1.2fr 1fr 28px"><div><span class="pill">${e.category}</span></div><div style="font-size:13px;color:var(--text2)">${e.note||'—'}</div><div style="font-family:monospace;font-size:12px">${e.date||'—'}</div><div style="font-weight:500">${euro(e.amount)}</div><div><button class="del" onclick="delI('expenses','${e.id}')">✕</button></div></div>`});
  if(!s.length)h+=`<div class="empty">Ni vnosov.</div>`;
  if(s.length)h+=`<div class="tf">Skupaj: ${euro(tot)}</div>`;
  h+=`</div>`;
  el.innerHTML=h;
}

function delI(col,id){if(!confirm('Izbrisati?'))return;db[col]=db[col].filter(x=>x.id!==id);persist();rAll()}
function updKm(vid){const v=db.vehicles.find(x=>x.id===vid);if(!v)return;const k=prompt('Km stanje za '+v.name+':',v.km||'');if(k===null)return;v.km=k;v.kmDate=new Date().toISOString().slice(0,10);persist();rAll()}
function saveFin(){const mo=document.getElementById('f-mo').value,sal=document.getElementById('f-sal').value;if(!mo||!sal){alert('Vnesite mesec in plačo.');return}const ex=db.finances.findIndex(f=>f.month===mo);const chk=document.getElementById('f-chk');const rev=document.getElementById('f-rev');const cc=document.getElementById('f-cc');const e={id:ex>=0?db.finances[ex].id:uid(),month:mo,salary:sal,savings:document.getElementById('f-sav').value,extra:document.getElementById('f-ext').value,checking:chk?chk.value:'',revolut:rev?rev.value:'',creditCard:cc?cc.value:'',note:document.getElementById('f-note').value};if(ex>=0)db.finances[ex]=e;else db.finances.push(e);persist();cm('mo-fin');rAll()}
function saveV(){const n=document.getElementById('v-n').value.trim();if(!n){alert('Vnesite naziv.');return}db.vehicles.push({id:uid(),name:n,make:document.getElementById('v-mk').value,model:document.getElementById('v-mo').value,year:document.getElementById('v-yr').value,reg:document.getElementById('v-rg').value,km:document.getElementById('v-km').value,kmDate:'',fuel:document.getElementById('v-fu').value});persist();cm('mo-v');rAll()}
function saveIns(){const vid=document.getElementById('i-v').value,to=document.getElementById('i-to').value,amt=document.getElementById('i-am').value;if(!vid||!to||!amt){alert('Izpolnite obvezna polja.');return}db.insurances.push({id:uid(),vehicleId:vid,type:document.getElementById('i-t').value,company:document.getElementById('i-co').value,paid:document.getElementById('i-pd').value,to,premium:amt,policy:document.getElementById('i-po').value});persist();cm('mo-ins');rAll()}
function saveSvc(){const vid=document.getElementById('svc-v').value;if(!vid){alert('Izberite vozilo.');return}db.services.push({id:uid(),vehicleId:vid,date:document.getElementById('svc-d').value,type:document.getElementById('svc-t').value,price:document.getElementById('svc-p').value,km:document.getElementById('svc-km').value,nextDate:document.getElementById('svc-nd').value,note:document.getElementById('svc-no').value,parts:[]});persist();cm('mo-svc');rAll()}
function saveHm(){const amt=document.getElementById('h-a').value;if(!amt){alert('Vnesite znesek.');return}db.homeExpenses.push({id:uid(),category:document.getElementById('h-c').value,date:document.getElementById('h-d').value,amount:amt,provider:document.getElementById('h-p').value,note:document.getElementById('h-n').value});persist();cm('mo-hm');rAll()}
function saveSub(){const n=document.getElementById('sb-n').value.trim(),amt=document.getElementById('sb-a').value;if(!n||!amt){alert('Vnesite naziv in znesek.');return}db.subscriptions.push({id:uid(),name:n,cat:document.getElementById('sb-c').value,freq:document.getElementById('sb-f').value,amount:amt,day:document.getElementById('sb-dy').value,date:document.getElementById('sb-d').value,note:document.getElementById('sb-no').value});persist();cm('mo-sub');rAll()}
function saveExp(){const amt=document.getElementById('e-a').value;if(!amt){alert('Vnesite znesek.');return}db.expenses.push({id:uid(),date:document.getElementById('e-d').value,category:document.getElementById('e-c').value,amount:amt,note:document.getElementById('e-n').value});persist();cm('mo-exp');rAll()}

init();

</script>
